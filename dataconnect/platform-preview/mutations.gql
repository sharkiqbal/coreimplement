# Write mutations for the /platform-preview demo data. All USER-level - there is
# exactly one real signed-in user in this project (the admin, no public sign-up
# flow exists), so "signed in at all" is an accurate stand-in for "is the admin,"
# the same reasoning already used in firestore.rules. Used by scripts/seed-demo-data.mjs
# and the optional admin "Demo Data" tab.

# --- Client ---

mutation CreateClient(
  $name: String!
  $industry: String!
  $contactName: String
  $contactEmail: String
  $status: String
) @auth(level: USER, insecureReason: "Only the single admin account can ever sign in - no public sign-up flow exists - so any signed-in user is the admin, same reasoning as firestore.rules.") {
  client_insert(
    data: {
      name: $name
      industry: $industry
      contactName: $contactName
      contactEmail: $contactEmail
      status: $status
    }
  )
}

mutation UpdateClientStatus($id: UUID!, $status: String!) @auth(level: USER, insecureReason: "Only the single admin account can ever sign in - no public sign-up flow exists - so any signed-in user is the admin, same reasoning as firestore.rules.") {
  client_update(id: $id, data: { status: $status })
}

mutation DeleteClient($id: UUID!) @auth(level: USER, insecureReason: "Only the single admin account can ever sign in - no public sign-up flow exists - so any signed-in user is the admin, same reasoning as firestore.rules.") {
  client_delete(id: $id)
}

