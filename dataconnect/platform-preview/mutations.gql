  $clientId: UUID!
  $integrationId: UUID!
  $status: String
  $connectedAt: Timestamp
) @auth(level: USER, insecureReason: "Only the single admin account can ever sign in - no public sign-up flow exists - so any signed-in user is the admin, same reasoning as firestore.rules.") {
  clientIntegration_insert(
    data: {
      clientId: $clientId
      integrationId: $integrationId
      status: $status
      connectedAt: $connectedAt
    }
  )
}

mutation UpdateClientIntegrationStatus(
  $clientId: UUID!
  $integrationId: UUID!
  $status: String!
) @auth(level: USER, insecureReason: "Only the single admin account can ever sign in - no public sign-up flow exists - so any signed-in user is the admin, same reasoning as firestore.rules.") {
  clientIntegration_update(
    key: { clientId: $clientId, integrationId: $integrationId }
    data: { status: $status }
  )
}

mutation DeleteClientIntegration($clientId: UUID!, $integrationId: UUID!)
@auth(level: USER, insecureReason: "Only the single admin account can ever sign in - no public sign-up flow exists - so any signed-in user is the admin, same reasoning as firestore.rules.") {
  clientIntegration_delete(
    key: { clientId: $clientId, integrationId: $integrationId }
  )
}

