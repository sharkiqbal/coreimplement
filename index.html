<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Only globally-constant, non-conflicting tags live here. Everything page-specific
      (description, robots, canonical, og:*, twitter:*) is owned exclusively by the
      <SEO> component (react-helmet-async) on each route - duplicating them here would
      create two competing tags in the DOM once Helmet mounts, which is worse than
      having none in the static markup.
    -->
    <title>Core Implement | AI Automation for Growing Businesses</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#796cbf" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    </style>
    <link href="tailwind.css" rel="stylesheet" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Core Implement",
        "url": "https://coreimplement.com/",
        "description": "AI automation and custom software consultancy helping growing businesses automate manual, repetitive work.",
        "email": "hello@coreimplement.com",
        "telephone": "+12484534597",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Houston",
          "addressRegion": "TX",
          "addressCountry": "US"
        },
        "areaServed": "US",
        "priceRange": "$$"
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/index.jsx"></script>
  </body>
</html>
